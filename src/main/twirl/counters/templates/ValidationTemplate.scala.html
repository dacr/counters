@import counters.routing.ValidationContext
@(validation: ValidationContext)
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="@validation.context.base/assets/font-awesome/css/all.min.css" rel="stylesheet">
    <link href="@validation.context.base/assets/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="@validation.context.base/images/logo-base-32.png">
    <title>@validation.context.title</title>
  </head>
  <body>
    <div class="container py-4">
      <div class="p-5 mb-4 bg-light rounded-5">
        <h1 class="display-5">
          <img src="@validation.context.base/images/logo-base-64.png"/>
          @validation.title
        </h1>
        <p class="lead">@validation.message</p>
        @for(code <- validation.confirmCode) {
          <form method="post" action="@validation.context.base/user/validate?code=@code">
            <button type="submit" class="btn btn-primary btn-lg">Confirm my email address</button>
          </form>
        }
        <hr class="my-4"/>
        <p class="text-right"><small>
          <i><a href="@validation.context.projectURL">@validation.context.appcode</a> @validation.context.buildVersion</i>
        </small></p>
      </div>
    </div>
  </body>
</html>
