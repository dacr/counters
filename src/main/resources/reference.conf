
counters {
  meta-info {
    // populated externally during the build
  }
  // ----------------------------------------------------------------
  // Application config

  application {
    name = "Counters"
    code = "counters"
  }

  http {
    listening-interface = "0.0.0.0"
    listening-interface = ${?COUNTERS_LISTEN_IP}
    listening-port = 8080
    listening-port = ${?COUNTERS_LISTEN_PORT}
  }

  site {
    # just a prefix word, no slashes
    prefix = ""
    prefix = ${?COUNTERS_PREFIX}
    # How the site is known remotely without any prefix and trailing /
    url = "http://127.0.0.1:8080"
    url = ${?COUNTERS_URL}
  }

  content {
    title = "COUNTERS"
  }

  behavior {
    file-system-storage {
      path = "/tmp/counters-data"
      path = ${?COUNTERS_STORE_PATH}
    }
    # how long a registration waits for its email to be validated, unvalidated registrations are then dropped
    email-validation-delay = 48h
    email-validation-delay = ${?COUNTERS_EMAIL_VALIDATION_DELAY}
  }

  mail {
    # sender of the emails sent by the service, such as the registration email validation
    from = "counters@localhost"
    from = ${?COUNTERS_MAIL_FROM}
    reply-to = ${?COUNTERS_MAIL_REPLY_TO}
    smtp {
      # without any host, emails are not sent but only logged, for development purposes
      host = ${?COUNTERS_SMTP_HOST}
      port = 465
      port = ${?COUNTERS_SMTP_PORT}
      # implicit (TLS from the first byte, usually port 465), starttls (usually port 587) or none
      tls = "implicit"
      tls = ${?COUNTERS_SMTP_TLS}
      username = ${?COUNTERS_SMTP_USERNAME}
      password = ${?COUNTERS_SMTP_PASSWORD}
    }
  }

  // ----------------------------------------------------------------
  // pekko & pekko-http framework configuration
  // This configuration is used when this project is used as an app and not as a lib

  pekko {
    daemonic = off
    http {
      server {
        idle-timeout = 10s
        max-connections = 500
        remote-address-header = on
        remote-address-attribute = on
        user-agent-header = on
      }
      client {
        connecting-timeout = 10s
        idle-timeout = 10s
        parsing {
          max-header-count = 420
        }
      }
      routing {
        # Enables/disables ETag and `If-Modified-Since` support for FileAndResourceDirectives
        file-get-conditional = off
      }
      host-connection-pool {
        max-connections = 100
      }
    }
    loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
    loglevel = "INFO"
    logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
  }

}
